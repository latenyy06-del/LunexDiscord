name: Build LunexDiscord

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Repository indir
        uses: actions/checkout@v4

      - name: Java 21 kur
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven ile derle
        run: mvn -B clean package

      - name: JAR dosyasını yükle
        uses: actions/upload-artifact@v4
        with:
          name: LunexDiscord
          path: target/*.jar
